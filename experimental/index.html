<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Palette Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.4.0/color-thief.umd.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .color-swatch {
            width: 100%;
            padding-bottom: 100%; /* Creates a square aspect ratio */
            border-radius: 0.5rem;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s ease-in-out;
            position: relative;
        }
        .color-swatch.selected {
            border-color: #3b82f6; /* Blue-500 */
        }
        .color-swatch:not(.selected) {
            opacity: 0.5;
            transform: scale(0.95);
        }
        .color-swatch:not(.selected)::after {
            content: ' ';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255,255,255,0.4);
            border-radius: 0.375rem;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-2xl bg-white rounded-xl shadow-lg p-6 md:p-8">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-gray-900">Image Palette Extractor</h1>
            <p class="text-gray-600 mt-2">Upload an image to generate a color palette, then click colors to build your final image.</p>
        </div>

        <!-- Controls -->
        <div class="bg-gray-50 border border-gray-200 rounded-lg p-4 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
                <div>
                    <label for="file-upload" class="block text-sm font-medium text-gray-700 mb-2">1. Upload your Image</label>
                    <input id="file-upload" type="file" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition-colors">
                </div>
                <div>
                    <label for="color-count" class="block text-sm font-medium text-gray-700 mb-2">2. Number of colors to find: <span id="color-count-value" class="font-bold text-blue-600">8</span></label>
                    <input id="color-count" type="range" min="3" max="16" value="8" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>
        </div>

        <!-- Status & Preview -->
        <div id="status-container" class="text-center my-4 min-h-[40px]"></div>

        <div id="result-container" class="hidden">
            <h2 class="text-lg font-semibold text-center mb-2">3. Click colors to include/exclude</h2>
            <div id="color-matrix" class="grid grid-cols-4 sm:grid-cols-8 gap-2 p-2 bg-gray-100 rounded-lg mb-6">
                <!-- Color swatches are injected here -->
            </div>

            <h2 class="text-lg font-semibold text-center mb-2">Your Downloadable Palette</h2>
            <div class="bg-gray-200 p-2 rounded-lg flex items-center justify-center min-h-[50px]">
                 <canvas id="palette-canvas" class="hidden"></canvas>
                 <img id="palette-image" class="rounded-md bg-white" alt="Generated Color Palette">
            </div>
             <div class="text-center mt-4">
                <p class="text-sm text-gray-600"><strong>Right-click</strong> the palette above and "<strong>Save Image As...</strong>" to download.</p>
            </div>
        </div>
         <div id="initial-message" class="text-center text-gray-500 py-8">
            <p>Your generated palette will appear here.</p>
        </div>
    </div>

    <script>
        const fileUpload = document.getElementById('file-upload');
        const colorCountSlider = document.getElementById('color-count');
        const colorCountValue = document.getElementById('color-count-value');
        const paletteCanvas = document.getElementById('palette-canvas');
        const paletteImage = document.getElementById('palette-image');
        const statusContainer = document.getElementById('status-container');
        const resultContainer = document.getElementById('result-container');
        const initialMessage = document.getElementById('initial-message');
        const colorMatrix = document.getElementById('color-matrix');
        const colorThief = new ColorThief();

        let fullPalette = [];
        let selectedColors = [];
        let processing = false;

        colorCountSlider.addEventListener('input', (e) => {
            colorCountValue.textContent = e.target.value;
        });
        
        fileUpload.addEventListener('change', handleFileSelect);
        colorCountSlider.addEventListener('change', handleFileSelect);

        function handleFileSelect() {
            if (processing || fileUpload.files.length === 0) return;
            
            processing = true;
            const file = fileUpload.files[0];
            const reader = new FileReader();

            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    showStatus(true, 'Extracting colors...');
                    initialMessage.classList.add('hidden');
                    resultContainer.classList.add('hidden');
                    
                    setTimeout(() => {
                        const k = parseInt(colorCountSlider.value, 10);
                        fullPalette = colorThief.getPalette(img, k);
                        fullPalette.sort((a, b) => getLuminosity(a) - getLuminosity(b));
                        
                        selectedColors = [...fullPalette]; // Initially, select all
                        
                        renderColorMatrix();
                        drawPaletteImage();

                        showStatus(false);
                        resultContainer.classList.remove('hidden');
                        processing = false;
                    }, 50);
                };
                img.crossOrigin = "Anonymous"; // Important for ColorThief
                img.src = event.target.result;
            };

            if (file) {
                 reader.readAsDataURL(file);
            } else {
                 processing = false;
            }
        }

        function renderColorMatrix() {
            colorMatrix.innerHTML = '';
            fullPalette.forEach((color, index) => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch selected';
                swatch.style.backgroundColor = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
                swatch.dataset.colorIndex = index;

                swatch.addEventListener('click', () => {
                    toggleColorSelection(index, swatch);
                });

                colorMatrix.appendChild(swatch);
            });
        }

        function toggleColorSelection(index, swatchElement) {
            swatchElement.classList.toggle('selected');
            const color = fullPalette[index];
            const isSelected = swatchElement.classList.contains('selected');
            
            if (isSelected) {
                selectedColors.push(color);
            } else {
                selectedColors = selectedColors.filter(c => JSON.stringify(c) !== JSON.stringify(color));
            }

            // Re-sort to maintain luminosity order in the final image
            selectedColors.sort((a, b) => getLuminosity(a) - getLuminosity(b));
            
            drawPaletteImage();
        }

        function showStatus(isLoading, message = '') {
            statusContainer.innerHTML = '';
            if (isLoading) {
                const loader = document.createElement('div');
                loader.className = 'loader mx-auto';
                const text = document.createElement('p');
                text.className = 'text-blue-600 mt-2';
                text.textContent = message;
                statusContainer.appendChild(loader);
                statusContainer.appendChild(text);
            } else {
                 statusContainer.innerHTML = `<p class="text-green-600 font-medium">Ready!</p>`;
            }
        }

        function getLuminosity(rgb) {
            return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
        }
        
        function drawPaletteImage() {
            const ctx = paletteCanvas.getContext('2d');
            const blockSize = 32;

            if (selectedColors.length === 0) {
                 paletteCanvas.width = blockSize;
                 paletteCanvas.height = blockSize;
                 ctx.clearRect(0, 0, blockSize, blockSize); // Make it transparent
            } else {
                paletteCanvas.width = selectedColors.length * blockSize;
                paletteCanvas.height = blockSize;
                selectedColors.forEach((color, i) => {
                    ctx.fillStyle = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
                    ctx.fillRect(i * blockSize, 0, blockSize, blockSize);
                });
            }

            paletteImage.src = paletteCanvas.toDataURL('image/png');
        }
    </script>
</body>
</html>
