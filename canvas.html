<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="media/favicon.ico" type="image/x-icon" />
    <title>Tesseŀla</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#111111" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- The main container for the app's visual output -->
    <div class="app-container">
      <main class="viewfinder">
        <div class="canvas-container">
          <!-- The primary canvas for displaying the video feed and UI -->
          <canvas id="displayCanvas"></canvas>
          <!-- A secondary canvas used for smooth transitions between frames -->
          <canvas id="transitionCanvas"></canvas>
        </div>
        <!-- The video element remains hidden, serving only as a data source -->
        <video id="videoFeed" playsinline autoplay muted></video>
        <!-- The file input is also hidden, triggered programmatically for desktop use -->
        <input
          type="file"
          id="imageInput"
          accept="image/*"
          style="display: none"
        />
      </main>
    </div>

    <!-- The main application logic -->
    <script src="canvas.js" type="module"></script>
  </body>
</html>
