<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="media/favicon.ico" type="image/x-icon" />
    <title>Tesseŀla</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#111111" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="chrome-area">
        <label for="paletteInput" id="palettePreview"></label>
      </header>

      <main class="viewfinder">
        <div class="canvas-container">
          <canvas id="displayCanvas"></canvas>
          <canvas id="transitionCanvas"></canvas>
        </div>
        <video id="videoFeed" playsinline autoplay muted></video>
        <input
          type="file"
          id="imageInput"
          accept="image/*"
          style="display: none"
        />
      </main>

      <footer class="chrome-area">
        <div class="button-container">
          <button id="resToggleBtn" aria-label="Toggle Resolution">
            <div class="res-icon">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
          </button>
          <button id="shutterBtn" aria-label="Shutter"></button>
          <button id="reverseCameraBtn" aria-label="Reverse Camera"></button>
        </div>
      </footer>
    </div>

    <script src="app.js" type="module"></script>
  </body>
</html>
