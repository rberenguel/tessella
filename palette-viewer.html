<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tessella Palette Viewer</title>
    <style>
      /* Basic styles for the body and layout */
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: #1a1a1a;
        color: #f0f0f0;
        margin: 0;
        padding: 2rem;
      }
      h1 {
        text-align: center;
        margin-bottom: 3rem;
        font-weight: 300;
        letter-spacing: 1px;
      }
      /* Main container for all the palette grids */
      #palettes-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 2rem;
        max-width: 1600px;
        margin: 0 auto;
      }
      /* Styling for each individual palette's container */
      .palette-item {
        background-color: #2c2c2e;
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        transition:
          transform 0.2s ease-in-out,
          box-shadow 0.2s ease-in-out;
      }
      .palette-item:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      }
      /* Palette name styling */
      .palette-item h2 {
        margin-top: 0;
        margin-bottom: 1rem;
        font-size: 1rem;
        font-weight: 500;
        color: #aaa;
        word-wrap: break-word;
      }
      /* Grid container for the color swatches */
      .swatch-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(30px, 1fr));
        gap: 8px;
      }
      /* Individual color swatch */
      .swatch {
        width: 100%;
        padding-bottom: 100%; /* Creates a square aspect ratio */
        border-radius: 6px;
        border: 1px solid rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>
  <body>
    <h1>Tessella Palette Viewer</h1>
    <div id="palettes-container">
      <!-- Palettes will be dynamically inserted here by the script -->
    </div>

    <script type="module" src="palette-viewer.js"></script>
  </body>
</html>
